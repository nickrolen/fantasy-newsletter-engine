# The nightly run, in the private repo's Actions (step 1c-ii).
#
# Lives in the ENGINE at deploy/state-repo/.github/workflows/nightly.yml and is
# installed into the private repo by `python scripts\state.py install-workflows`.
# Edit it in the engine, never in the private repo. No secrets in this file:
# they are only referenced, in run.yml.
name: Nightly

# FIRED BY cron-job.org ONLY (task 6f, Nick 11-11): the "Nightly" job, daily at
# 00:05, 00:35, 01:05 and 01:35 America/Los_Angeles (deploy/state-repo/
# cron-job-org.json). GitHub's own cron was removed: it delayed and dropped
# firings (11-05/06), and every firing billed a minute. The guard
# (scripts/run_guard.py) admits the first firing after midnight on the league
# clock that finds tonight's run hasn't happened (output/nightly_last.json);
# the rest exit in seconds.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now: skip the 12:01 AM time guard (by hand only; a schedule never forces)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  nightly:
    uses: ./.github/workflows/run.yml
    with:
      mode: nightly
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
    secrets: inherit
