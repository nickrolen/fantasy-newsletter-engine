# The nightly run, in the private repo's Actions (step 1c-ii).
#
# Lives in the ENGINE at deploy/state-repo/.github/workflows/nightly.yml and is
# installed into the private repo by `python scripts\state.py install-workflows`.
# Edit it in the engine, never in the private repo. No secrets in this file:
# they are only referenced, in run.yml.
name: Nightly

on:
  schedule:
    # Every 30 minutes from 07:01 to 11:31 UTC: midnight to about 4:30 AM
    # Pacific in daylight time, 11 PM to about 3:30 AM in standard time. The
    # guard (scripts/run_guard.py) admits the first firing after midnight on
    # the league clock that finds tonight's run hasn't happened
    # (output/nightly_last.json); the rest exit in seconds. GitHub delays and
    # drops scheduled firings under load (11-05: the first scheduled night
    # never fired), so one late or lost firing only delays the night.
    - cron: '1,31 7-11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now: skip the 12:01 AM time guard (by hand only; a schedule never forces)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  nightly:
    uses: ./.github/workflows/run.yml
    with:
      mode: nightly
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
    secrets: inherit
