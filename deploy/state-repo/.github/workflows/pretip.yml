# Monday's pre-tip run, in the private repo's Actions (step 1c-ii).
#
# Lives in the ENGINE at deploy/state-repo/.github/workflows/pretip.yml and is
# installed into the private repo by `python scripts\state.py install-workflows`.
# Edit it in the engine, never in the private repo.
name: Pre-tip

# FIRED BY cron-job.org ONLY (task 6f, Nick 11-11): the "Pre-tip" job, Mondays
# every 15 minutes from 07:00 to 19:45 America/Los_Angeles (deploy/state-repo/
# cron-job-org.json). GitHub's own crons were removed.
on:
  workflow_dispatch:
    # The guard (scripts/run_guard.py pretip) admits a firing only in
    # [first tip - 45 min, first tip) on a window day (a fantasy week's first
    # day), so three firings run on a window Monday and the rest exit in
    # seconds. The range reaches back to the morning for the holiday Mondays
    # whose first tip is 9:00 AM Pacific (MLK Day 2027-01-18, Presidents' Day
    # 2027-02-15) and forward to 19:30 Pacific; tests/test_cloud_run.py checks
    # every window day of the season against it.
    # Step 3b: a firing outside the pre-tip window, while Monday's window is
    # open (12:01 AM to the last tip - 5 min), on the :00 or :30 slot, POLLS
    # Yahoo's transactions in the guard job instead (run.yml; scripts/
    # monday_poll.py): a new one runs the refresh, nothing new runs nothing.

permissions:
  contents: write
  issues: write

jobs:
  pretip:
    uses: ./.github/workflows/run.yml
    with:
      mode: pretip
    secrets: inherit
