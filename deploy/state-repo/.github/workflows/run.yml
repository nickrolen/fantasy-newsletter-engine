# One run of the engine on the private repo's state: the guard, then (only if
# it says go) the run itself. Called by nightly.yml and pretip.yml; never
# scheduled on its own. Step 1c-ii (claude/HANDOFF_STEP1C2_CLOUD_RUN_2026-11-03.md s.4).
#
# Step 3a (claude/HANDOFF_STEP3A_PHONE_ENTRIES_2026-11-10.md): mode "refresh",
# called by entry.yml (Nick's phone entries, entry: true) and overrides-push.yml
# (the desk changed config/INJURY_OVERRIDES.json, with its cause). A refresh has
# no clock guard (the guard job is skipped); it shares the run job, so its one
# concurrency group queues it behind a nightly or pre-tip run and them behind it.
# With entry: true the run job first applies the issue's title
# (scripts/apply_entry.py), commits the state, answers the issue (comment;
# closed when applied, left open labelled entry-refused when refused), then
# refreshes with the entry as its cause, and comments the effect. A refusal
# changes nothing and exits 0: no refresh, no failure issue.
#
# Step 3b (claude/HANDOFF_STEP3B_TAG_FRESHNESS_2026-11-10.md):
#   - Monday polling: a pre-tip firing the guard marks poll=true (a :00 or :30
#     firing while Monday's window is open, outside the pre-tip window) reads
#     Yahoo's latest transactions IN THE GUARD JOB (scripts/monday_poll.py, the
#     two Yahoo client packages pinned below): that job bills its minute anyway,
#     so a poll that finds nothing writes, commits and publishes nothing and
#     costs nothing more. A new transaction starts the run job with kind poll:
#     `nightly.py --poll` (sync, then a refresh named after the transactions).
#   - mode "afternoon" (afternoon.yml, fired by cron-job.org at the times in
#     config live_refresh.afternoon_firings): the guard admits today's firing;
#     the run is `nightly.py --afternoon` (tags, the NBA report, a refresh).
#   - the installed requirements are cached as a venv keyed on requirements.txt
#     and the Python version: an install that took 40-60 s is a restore.
#   - two issue kinds (scripts/flag_issues.py plans them): nba-report (an NBA
#     report Out Yahoo does not show, one per player per game) and o-no-entry
#     (the O-past-3-games nudge, nightly, one per player).
#
# Lives in the ENGINE at deploy/state-repo/.github/workflows/run.yml and is
# installed into the private repo by `python scripts\state.py install-workflows`.
# Edit it in the engine, never in the private repo.
#
# SECRETS (private repo -> Settings -> Secrets and variables -> Actions), only
# ever referenced here, never printed:
#   YAHOO_OAUTH_JSON  the contents of oauth2.json (written to the runner, mode 600)
#   HUB_PASSPHRASE    the hub's passphrase (the run step's environment only)
#   HUB_DEPLOY_TOKEN  a fine-grained token: newsletter-hub, Contents read and write
# The workflow's own token (contents: write, issues: write) commits state and
# opens the failure issue. Never a personal token for those.
#
# NEVER passed here: the by-hand escape flags (a dirty engine, an engine
# mismatch, no league state). tests/test_cloud_run.py reads these files and
# fails if any of them appears, even in a comment.
name: Run

on:
  workflow_call:
    inputs:
      mode:
        description: 'nightly, pretip, afternoon or refresh'
        type: string
        required: true
      cause:
        description: 'refresh only: what triggered it, one short line (the desk push passes its own)'
        type: string
        default: ''
      entry:
        description: 'refresh only: apply the triggering issue title (and any missed entry) first'
        type: boolean
        default: false
      force:
        description: 'nightly only, from workflow_dispatch only: skip the time guard'
        type: boolean
        default: false

env:
  TZ: America/Los_Angeles
  ENGINE_REPO: nickrolen/fantasy-newsletter-engine
  HUB_REPO: nickrolen/newsletter-hub
  MODE: ${{ inputs.mode }}
  # A schedule can never force: the caller passes force only from
  # workflow_dispatch, and it is checked against the event again here.
  FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
  RUN_ID: ${{ github.run_id }}
  CAUSE_INPUT: ${{ inputs.cause }}
  ENTRY: ${{ inputs.entry }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # ---------------------------------------------------------------------------
  # The guard: the runner's own python3, the standard library, four files of the
  # engine. Most firings stop here, in seconds. No concurrency group: an idle
  # firing never waits behind, or displaces, a run that writes state.
  # ---------------------------------------------------------------------------
  guard:
    # a refresh has no clock guard: it runs whenever an entry lands (step 3a)
    if: inputs.mode != 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # step 3b: a poll that found a new transaction starts the run job too
      go: ${{ steps.guard.outputs.go == 'true' || steps.poll.outputs.go == 'true' }}
      kind: ${{ steps.poll.outputs.go == 'true' && 'poll' || inputs.mode }}
      reason: ${{ steps.guard.outputs.reason || steps.poll.outputs.reason }}
    steps:
      - name: ENGINE_COMMIT, the night's marker and the refetched schedule (the private repo)
        uses: actions/checkout@v6
        with:
          path: state
          sparse-checkout: |
            /ENGINE_COMMIT
            /output/nightly_last.json
            /data/nba_schedule_*.refetched.json
            /data/transaction_log.jsonl
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: Pin
        id: pin
        run: |
          c="$(tr -d '[:space:]' < state/ENGINE_COMMIT)"
          if ! [[ "$c" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ENGINE_COMMIT is not a full commit SHA: '$c'"
            exit 1
          fi
          echo "commit=$c" >> "$GITHUB_OUTPUT"

      - name: The guard's four files, from the engine at ENGINE_COMMIT
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ steps.pin.outputs.commit }}
          path: engine
          sparse-checkout: |
            /scripts/run_guard.py
            /scripts/monday_poll.py
            /config/league_config.json
            /config/SCHEDULE.json
            /data/nba_schedule_*.json
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: Guard
        id: guard
        run: |
          if [ "$MODE" = nightly ] && [ "$FORCE" = true ]; then
            echo "force (workflow_dispatch): the night's guard is skipped"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 engine/scripts/run_guard.py "$MODE" --base-path engine --state-dir state > guard.log 2>&1
          rc=$?
          cat guard.log
          if [ "$rc" -ne 0 ]; then
            echo "reason=$(tail -n 1 guard.log | cut -c1-160)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # -- step 3b: Monday polling, in this job (it bills a minute anyway)
      - name: 'Poll: the Yahoo client (pinned)'
        if: steps.guard.outputs.poll == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/pv"
          "$RUNNER_TEMP/pv/bin/python" -m pip install -q yahoo-oauth==2.1.1 yahoo-fantasy-api==2.12.3

      - name: "Poll: Yahoo's transactions since the last sync"
        id: poll
        if: steps.guard.outputs.poll == 'true'
        env:
          YAHOO_OAUTH_JSON: ${{ secrets.YAHOO_OAUTH_JSON }}
        run: |
          if [ -z "$YAHOO_OAUTH_JSON" ]; then
            echo "reason=the secret YAHOO_OAUTH_JSON is not set" >> "$GITHUB_OUTPUT"; exit 1
          fi
          umask 077
          printf '%s' "$YAHOO_OAUTH_JSON" > "$RUNNER_TEMP/oauth2.json"
          set +e
          "$RUNNER_TEMP/pv/bin/python" engine/scripts/monday_poll.py --base-path engine --state-dir state \
            --oauth "$RUNNER_TEMP/oauth2.json" > poll.log 2>&1
          rc=$?
          cat poll.log
          rm -f "$RUNNER_TEMP/oauth2.json"
          if [ "$rc" -ne 0 ]; then
            echo "reason=poll: $(tail -n 1 poll.log | cut -c1-150)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # The guard itself failed (a missing file or tip time): the failure issue.
  guard-failed:
    needs: guard
    if: failure() && needs.guard.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or comment on the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.guard.outputs.reason }}
        run: |
          title="Nightly run failed: guard: ${REASON:-see the run log}"
          printf 'The %s guard failed: %s\n\nRun: %s\n\nThis issue closes on the next good run.\n' \
            "$MODE" "${REASON:-see the run log}" "$RUN_URL" > body.md
          gh label create run-failed --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "A nightly or pre-tip run failed" --force
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label run-failed --state open \
                --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label run-failed --body-file body.md
          fi

  # ---------------------------------------------------------------------------
  # The run. One concurrency group for every workflow that writes state, never
  # cancelled: runs queue (design s.2.4).
  # ---------------------------------------------------------------------------
  run:
    needs: guard
    if: ${{ !cancelled() && (needs.guard.outputs.go == 'true' || (inputs.mode == 'refresh' && needs.guard.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: newsletter-state
      cancel-in-progress: false
    steps:
      - name: Check out the private repo (state)
        id: state
        uses: actions/checkout@v6
        with:
          path: state

      - name: ENGINE_COMMIT
        id: pin
        run: |
          c="$(tr -d '[:space:]' < state/ENGINE_COMMIT)"
          if ! [[ "$c" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ENGINE_COMMIT is not a full commit SHA: '$c'" | tee "$RUNNER_TEMP/pin.log"
            exit 1
          fi
          echo "commit=$c" >> "$GITHUB_OUTPUT"

      - name: Check out the engine at ENGINE_COMMIT
        id: engine
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ steps.pin.outputs.commit }}
          path: engine
          persist-credentials: false

      - name: Refuse unless the engine checkout is exactly ENGINE_COMMIT
        id: engine-check
        env:
          PIN: ${{ steps.pin.outputs.commit }}
        run: |
          head="$(git -C engine rev-parse HEAD)"
          if [ "$head" != "$PIN" ]; then
            echo "the engine checkout is at $head, not ENGINE_COMMIT $PIN" | tee "$RUNNER_TEMP/engine-check.log"
            exit 1
          fi
          echo "engine at ENGINE_COMMIT $PIN"

      - name: Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # step 3b: the installed requirements, cached whole (a venv keyed on the
      # exact Python and requirements.txt): a restore instead of a 40-60 s install
      - name: The installed requirements (cache)
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('engine/requirements.txt') }}

      - name: Requirements
        id: install
        run: |
          {
            if [ ! -x "$HOME/venv/bin/python" ]; then python -m venv "$HOME/venv" || exit 1; fi
            "$HOME/venv/bin/python" -m pip install -q -r engine/requirements.txt || exit 1
            echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee "$RUNNER_TEMP/install.log"
          exit "${PIPESTATUS[0]}"

      - name: Overlay the state onto the engine
        id: overlay-in
        working-directory: engine
        run: |
          python scripts/state_overlay.py in --state-dir ../state 2>&1 | tee "$RUNNER_TEMP/overlay-in.log"
          exit "${PIPESTATUS[0]}"

      - name: Credentials
        id: credentials
        working-directory: engine
        env:
          YAHOO_OAUTH_JSON: ${{ secrets.YAHOO_OAUTH_JSON }}
          HUB_PASSPHRASE: ${{ secrets.HUB_PASSPHRASE }}
        run: |
          if [ -z "$YAHOO_OAUTH_JSON" ]; then
            echo "the secret YAHOO_OAUTH_JSON is not set" | tee "$RUNNER_TEMP/credentials.log"; exit 1
          fi
          if [ -z "$HUB_PASSPHRASE" ]; then
            echo "the secret HUB_PASSPHRASE is not set" | tee "$RUNNER_TEMP/credentials.log"; exit 1
          fi
          umask 077
          printf '%s' "$YAHOO_OAUTH_JSON" > oauth2.json
          if ! python -c "import json; json.load(open('oauth2.json'))" 2>/dev/null; then
            echo "the secret YAHOO_OAUTH_JSON is not valid JSON" | tee "$RUNNER_TEMP/credentials.log"; exit 1
          fi
          echo "oauth2.json written (mode 600); contents not shown"

      - name: Rows in the run record before the run
        id: before
        working-directory: engine
        run: |
          n=0
          if [ -f output/nightly_runs.jsonl ]; then n="$(wc -l < output/nightly_runs.jsonl)"; fi
          echo "rows=$n" >> "$GITHUB_OUTPUT"

      # -- step 3a: Nick's phone entry (entry.yml). Never interpolate the title into
      #    a command: apply_entry.py reads it from the event payload.
      - name: Nick's open issues (missed entries are applied too)
        id: entry-list
        if: inputs.entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --author nickrolen --limit 100 \
            --json number,title,createdAt,author,labels > "$RUNNER_TEMP/open.json"

      - name: Apply the entry
        id: entry
        if: inputs.entry
        working-directory: engine
        run: |
          python scripts/apply_entry.py apply --event "$GITHUB_EVENT_PATH" \
            --open-issues "$RUNNER_TEMP/open.json" --out-dir "$RUNNER_TEMP/entry" 2>&1 | tee "$RUNNER_TEMP/entry.log"
          exit "${PIPESTATUS[0]}"

      - name: Commit the entry to the private repo
        id: entry-commit
        if: steps.entry.outputs.applied == 'true'
        working-directory: engine
        env:
          CAUSE: ${{ steps.entry.outputs.cause }}
        run: |
          {
            python scripts/state_overlay.py out --state-dir ../state || exit 1
            cd ../state
            git config user.name "newsletter-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "the entry changed no state file"; exit 1; fi
            git commit -q -m "entry: $CAUSE" -m "$RUN_URL"
            if git push -q origin HEAD; then echo "entry committed: $(git rev-parse --short HEAD)"; exit 0; fi
            b="rescue/run-$RUN_ID"
            git push -q origin "HEAD:refs/heads/$b"
            echo "the private repo moved: the entry is on branch $b, not merged; ask before merging it"
            exit 1
          } 2>&1 | tee "$RUNNER_TEMP/entry-commit.log"
          exit "${PIPESTATUS[0]}"

      - name: Answer the issues (comment; close when applied, label when refused)
        id: entry-answer
        if: always() && steps.entry.outcome == 'success' && steps.entry-commit.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/entry"
          gh label create entry-refused --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "A phone entry was refused: edit the title to fix it" --force
          python3 -c 'import json,sys; [print(a["issue"], a.get("comment_file") or "-", int(a["close"]), a["label"] or "-", int(a["unlabel"])) for a in json.load(open(sys.argv[1]))]' "$d/actions.json" |
          while read -r n file close label unlabel; do
            if [ "$unlabel" = 1 ]; then gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label entry-refused || true; fi
            if [ "$file" != - ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$d/$file"; fi
            if [ "$label" != - ]; then gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --add-label "$label"; fi
            if [ "$close" = 1 ]; then gh issue close "$n" --repo "$GITHUB_REPOSITORY"; fi
          done

      - name: Run
        id: run
        working-directory: engine
        env:
          HUB_PASSPHRASE: ${{ secrets.HUB_PASSPHRASE }}
          ENGINE_COMMIT: ${{ steps.pin.outputs.commit }}
          APPLIED: ${{ steps.entry.outputs.applied }}
          ENTRY_CAUSE: ${{ steps.entry.outputs.cause }}
          KIND: ${{ needs.guard.outputs.kind }}
        run: |
          if [ "$MODE" = refresh ]; then
            if [ "$ENTRY" = true ] && [ "$APPLIED" != true ]; then
              echo "no entry was applied: nothing to refresh"
              echo "ran=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            c="${ENTRY_CAUSE:-$CAUSE_INPUT}"
            if [ -z "$c" ]; then echo "a refresh needs its cause" | tee "$RUNNER_TEMP/run.log"; exit 1; fi
            set -- --refresh --cause "$c"
          elif [ "$MODE" = pretip ] && [ "$KIND" = poll ]; then
            set -- --poll
          elif [ "$MODE" = pretip ]; then
            set -- --pretip --scheduled
          elif [ "$MODE" = afternoon ]; then
            set -- --afternoon
          elif [ "$MODE" = nightly ] && [ "$FORCE" = true ]; then
            set -- --scheduled --ignore-clock
          elif [ "$MODE" = nightly ]; then
            set -- --scheduled
          else
            echo "unknown mode '$MODE'" | tee "$RUNNER_TEMP/run.log"; exit 1
          fi
          echo "python scripts/nightly.py $*"
          python scripts/nightly.py "$@" 2>&1 | tee "$RUNNER_TEMP/run.log"
          exit "${PIPESTATUS[0]}"

      # -- always (good or refused): copy back, commit only if something changed
      - name: Copy the state back
        id: overlay-out
        if: always() && steps.overlay-in.outcome == 'success'
        working-directory: engine
        run: |
          python scripts/state_overlay.py out --state-dir ../state 2>&1 | tee "$RUNNER_TEMP/overlay-out.log"
          exit "${PIPESTATUS[0]}"

      - name: Commit the state to the private repo
        id: commit-state
        if: always() && steps.overlay-out.outcome == 'success'
        working-directory: state
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          {
            git config user.name "newsletter-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "state unchanged: nothing to commit"
              exit 0
            fi
            git commit -q -m "$MODE run $RUN_ID: $OUTCOME" -m "$RUN_URL"
            if git push -q origin HEAD; then
              echo "state committed: $(git rev-parse --short HEAD)"
              exit 0
            fi
            b="rescue/run-$RUN_ID"
            git push -q origin "HEAD:refs/heads/$b"
            echo "the private repo moved during the run: this run's state is on branch $b, not merged; ask before merging it"
            exit 1
          } 2>&1 | tee "$RUNNER_TEMP/commit-state.log"
          exit "${PIPESTATUS[0]}"

      # -- publish, on success only, and only when the run ran: a scheduled run
      #    the guard declined at its start (ran=false) built no hub
      - name: HUB_DEPLOY_TOKEN is set
        id: hub-token
        if: steps.run.outputs.ran == 'true'
        env:
          HUB_DEPLOY_TOKEN: ${{ secrets.HUB_DEPLOY_TOKEN }}
        run: |
          if [ -z "$HUB_DEPLOY_TOKEN" ]; then
            echo "the secret HUB_DEPLOY_TOKEN is not set" | tee "$RUNNER_TEMP/hub-token.log"; exit 1
          fi

      - name: Check out the hub repo
        id: hub-checkout
        if: steps.run.outputs.ran == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HUB_REPO }}
          ref: main
          path: hub
          token: ${{ secrets.HUB_DEPLOY_TOKEN }}

      - name: Stage the hub, and scan exactly what will be pushed
        id: publish-scan
        if: steps.run.outputs.ran == 'true'
        working-directory: engine
        run: |
          python scripts/hub_deploy.py --target ../hub 2>&1 | tee "$RUNNER_TEMP/publish-scan.log"
          exit "${PIPESTATUS[0]}"

      - name: Publish the hub (only if it changed)
        id: publish
        if: steps.run.outputs.ran == 'true'
        working-directory: hub
        run: |
          {
            git config user.name "newsletter-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "hub unchanged: nothing to publish"
              exit 0
            fi
            git commit -q -m "hub: $MODE run $RUN_ID"
            git push -q origin HEAD:main
            echo "hub published: $(git rev-parse --short HEAD)"
          } 2>&1 | tee "$RUNNER_TEMP/publish.log"
          exit "${PIPESTATUS[0]}"

      # -- the failure issue: one open at a time; the next good run closes it
      # -- step 3a: the entry's effect, once the refresh has priced (or not)
      - name: Comment the entry's effect
        if: always() && steps.entry.outputs.applied == 'true' && steps.entry-answer.outcome == 'success'
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ steps.before.outputs.rows }}
        run: |
          d="$RUNNER_TEMP/entry"
          python scripts/apply_entry.py effect --out-dir "$d" --runs-file output/nightly_runs.jsonl --skip "${ROWS:-0}"
          for n in $(python3 -c 'import json,sys; print(" ".join(str(a["issue"]) for a in json.load(open(sys.argv[1])) if a["verdict"] == "applied"))' "$d/actions.json"); do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$d/effect.md"
          done

      # -- step 3a, decision 13b: a passed return date still tagged O/OFS (or with
      #    no Yahoo tag known): one issue per player while it is open (deduped by
      #    title); an open one no longer listed tonight is closed
      - name: Open or close the passed-return issues
        if: always() && steps.run.outputs.returns == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ steps.before.outputs.rows }}
        run: |
          s=engine/scripts/returns_issue.py
          args=(--runs-file engine/output/nightly_runs.jsonl --skip "${ROWS:-0}")
          python3 "$s" titles "${args[@]}" > "$RUNNER_TEMP/returns.txt"
          gh label create return-passed --repo "$GITHUB_REPOSITORY" --color 5319E7 \
            --description "An injury entry's return date passed and he is still out: push or remove" --force
          gh issue list --repo "$GITHUB_REPOSITORY" --label return-passed --state open --limit 100 \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' > "$RUNNER_TEMP/returns_open.tsv"
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            if cut -f2- "$RUNNER_TEMP/returns_open.tsv" | grep -qxF -- "$t"; then echo "open already: $t"; continue; fi
            python3 "$s" body "${args[@]}" --title "$t" --run-url "$RUN_URL" > "$RUNNER_TEMP/returns_body.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$t" --label return-passed --body-file "$RUNNER_TEMP/returns_body.md"
          done < "$RUNNER_TEMP/returns.txt"
          while IFS=$'\t' read -r n t; do
            [ -z "$n" ] && continue
            if ! grep -qxF -- "$t" "$RUNNER_TEMP/returns.txt"; then
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Answered: no longer a passed return date ($RUN_URL)"
            fi
          done < "$RUNNER_TEMP/returns_open.tsv"

      # a refresh never closes the failure issue: it skips the log pull, so a
      # night that failed there is not repaired by it (nor do a poll and the
      # afternoon check, refreshes too: step 3b)
      - name: Close the failure issue
        if: success() && steps.run.outputs.ran == 'true' && inputs.mode != 'refresh' && inputs.mode != 'afternoon' && needs.guard.outputs.kind != 'poll'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create run-failed --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "A nightly or pre-tip run failed" --force
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label run-failed --state open \
                       --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Closed by the good $MODE run $RUN_ID: $RUN_URL"
          done

      # -- step 3b: the NBA report's flags (an Out Yahoo does not show; a name that
      #    looks like a rostered player's and matches nobody): one issue per player
      #    per game, deduped by title; the nightly closes those whose game is over
      - name: Open or close the NBA-report issues
        if: always() && steps.run.outcome == 'success' && (steps.run.outputs.nba_flags == 'true' || inputs.mode == 'nightly')
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ steps.before.outputs.rows }}
        run: |
          d="$RUNNER_TEMP/nba_issues"
          gh label create nba-report --repo "$GITHUB_REPOSITORY" --color C2410C \
            --description "The NBA's injury report has a rostered player Out that Yahoo doesn't show" --force
          gh issue list --repo "$GITHUB_REPOSITORY" --label nba-report --state open --limit 100 \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' > "$RUNNER_TEMP/nba_open.tsv"
          python3 engine/scripts/flag_issues.py plan --kind nba --runs-file engine/output/nightly_runs.jsonl \
            --skip "${ROWS:-0}" --open "$RUNNER_TEMP/nba_open.tsv" --out-dir "$d"
          while IFS=$'\t' read -r act n title f; do
            case "$act" in
              create) gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label nba-report --body-file "$d/$f" ;;
              close)  gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$d/$f") ($RUN_URL)" ;;
            esac
          done < "$d/plan.tsv"

      # -- step 3b: the O-past-3-games nudge (nightly): one issue per player,
      #    matched by the player (its count grows nightly), closed once answered
      - name: Open, update or close the O-past-3-games issues
        if: always() && steps.run.outcome == 'success' && steps.run.outputs.nudges == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ steps.before.outputs.rows }}
        run: |
          d="$RUNNER_TEMP/nudge_issues"
          gh label create o-no-entry --repo "$GITHUB_REPOSITORY" --color 1D76DB \
            --description "Tagged O past 3 games with no injury entry: add one from the phone" --force
          gh issue list --repo "$GITHUB_REPOSITORY" --label o-no-entry --state open --limit 100 \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' > "$RUNNER_TEMP/nudge_open.tsv"
          python3 engine/scripts/flag_issues.py plan --kind nudge --runs-file engine/output/nightly_runs.jsonl \
            --skip "${ROWS:-0}" --open "$RUNNER_TEMP/nudge_open.tsv" --out-dir "$d"
          while IFS=$'\t' read -r act n title f; do
            case "$act" in
              create) gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label o-no-entry --body-file "$d/$f" ;;
              edit)   gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --title "$title" ;;
              close)  gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$d/$f") ($RUN_URL)" ;;
            esac
          done < "$d/plan.tsv"

      # -- the move ledger's flags (step 2): their own issue, never the failure
      #    issue -- a flag does not fail the run, and a good run does not close it
      - name: Open or comment on the ledger issue
        if: always() && steps.run.outputs.ledger_flags == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ steps.before.outputs.rows }}
        run: |
          s=engine/scripts/ledger_issue.py
          args=(--runs-file engine/output/nightly_runs.jsonl --skip "${ROWS:-0}")
          title="$(python3 "$s" title "${args[@]}")"
          python3 "$s" body "${args[@]}" --run-url "$RUN_URL" > "$RUNNER_TEMP/ledger.md"
          echo "$title"
          gh label create move-ledger --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "The move ledger flagged something (missing, conflict, outside a window, shadow)" --force
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label move-ledger --state open \
                --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            printf '\n**%s**\n' "$title" >> "$RUNNER_TEMP/ledger.md"
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/ledger.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label move-ledger \
              --body-file "$RUNNER_TEMP/ledger.md"
          fi

      # -- the NBA schedule's flag (task 46): stand-ins still there at their week's
      #    window. Its own issue: the run did not fail, and a good run closes the
      #    failure issue, so that one could not carry it
      - name: Open or comment on the schedule issue
        if: always() && steps.run.outputs.schedule_flags == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ steps.before.outputs.rows }}
        run: |
          s=engine/scripts/schedule_issue.py
          args=(--runs-file engine/output/nightly_runs.jsonl --skip "${ROWS:-0}")
          title="$(python3 "$s" title "${args[@]}")"
          python3 "$s" body "${args[@]}" --run-url "$RUN_URL" > "$RUNNER_TEMP/schedule.md"
          echo "$title"
          gh label create nba-schedule --repo "$GITHUB_REPOSITORY" --color 0E8A16 \
            --description "NBA games still unscheduled at their week's window: refetch the schedule" --force
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label nba-schedule --state open \
                --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            printf '\n**%s**\n' "$title" >> "$RUNNER_TEMP/schedule.md"
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/schedule.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label nba-schedule \
              --body-file "$RUNNER_TEMP/schedule.md"
          fi

      - name: Open or comment on the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ steps.before.outputs.rows }}
          OUTCOMES: >-
            state=${{ steps.state.outcome }},pin=${{ steps.pin.outcome }},engine=${{ steps.engine.outcome }},engine-check=${{ steps.engine-check.outcome }},python=${{ steps.python.outcome }},venv=${{ steps.venv.outcome }},install=${{ steps.install.outcome }},overlay-in=${{ steps.overlay-in.outcome }},credentials=${{ steps.credentials.outcome }},entry=${{ steps.entry.outcome }},entry-commit=${{ steps.entry-commit.outcome }},run=${{ steps.run.outcome }},overlay-out=${{ steps.overlay-out.outcome }},commit-state=${{ steps.commit-state.outcome }},hub-token=${{ steps.hub-token.outcome }},hub-checkout=${{ steps.hub-checkout.outcome }},publish-scan=${{ steps.publish-scan.outcome }},publish=${{ steps.publish.outcome }}
        run: |
          s=engine/scripts/run_issue.py
          if [ -f "$s" ]; then
            args=(--outcomes "$OUTCOMES" --runs-file engine/output/nightly_runs.jsonl
                  --skip "${ROWS:-0}" --logs "$RUNNER_TEMP")
            title="$(python3 "$s" title "${args[@]}")"
            python3 "$s" body "${args[@]}" --run-url "$RUN_URL" --mode "$MODE" > "$RUNNER_TEMP/issue.md"
          else
            title="Nightly run failed: checkout: see the run log"
            printf 'Run: %s\n' "$RUN_URL" > "$RUNNER_TEMP/issue.md"
          fi
          echo "$title"
          gh label create run-failed --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "A nightly or pre-tip run failed" --force
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label run-failed --state open \
                --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            printf '\n**%s**\n' "$title" >> "$RUNNER_TEMP/issue.md"
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label run-failed \
              --body-file "$RUNNER_TEMP/issue.md"
          fi
