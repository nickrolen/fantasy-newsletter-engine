<!-- @dsCard group="Shell" height=250 subtitle="Dark header with freshness; the stale state below it" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AppHeader</title></head>
<body>
<div style="max-width:390px; display:flex; flex-direction:column; gap:16px;">
  <header class="lh-header lh-on-dark">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <span class="lh-header__title">League Hub</span>
        <span class="lh-header__date">Week 6 · Wed Dec 2</span>
      </div>
      <button class="lh-iconbtn" aria-label="Search players and teams">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="lh-fresh"><span class="lh-fresh__dot"></span><span>Updated 14 min ago · lines live until 4:00 PM</span></div>
  </header>
  <div>
    <header class="lh-header lh-on-dark" style="padding-bottom:12px;">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <span class="lh-header__title">League Hub</span>
        <span class="lh-header__date">Week 6 · Wed Dec 2</span>
      </div>
    </header>
    <div class="lh-stale" role="status">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none; margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16h.01"/></svg>
      <span>Not updated since last night (19 h). Lines and win chances may be out of date.</span>
    </div>
  </div>
</div>
</body></html>
