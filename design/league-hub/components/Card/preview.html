<!-- @dsCard group="Layout" height=210 subtitle="A section card with eyebrow title, meta and a link" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Card</title></head>
<body>
<div class="lh-stack" style="max-width:390px;">
  <section class="lh-card">
    <div class="lh-sechead">
      <h2 class="lh-eyebrow">Trade block</h2>
      <span class="lh-meta">Updated Mon</span>
    </div>
    <div class="lh-divider" style="padding-top:10px; display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="display:flex; align-items:center; gap:8px;" class="lh-t-plum"><span class="lh-swatch"></span><span style="font-size:13px; font-weight:800;">Fast Break Bros</span></span>
        <span class="lh-status lh-status--neutral">Selling</span>
      </div>
      <span style="font-size:13px; color:var(--ink-2);">On the block: Zach LaVine, Jerami Grant · Wants: young bigs, picks</span>
    </div>
    <div class="lh-divider" style="display:flex; justify-content:flex-end;"><a href="#" class="lh-link">Full trade block ›</a></div>
  </section>
</div>
</body></html>
