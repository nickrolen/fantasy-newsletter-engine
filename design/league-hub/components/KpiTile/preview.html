<!-- @dsCard group="Data" height=330 subtitle="Value, label, and always a context line" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KpiTile</title></head>
<body>
<div class="lh-stack" style="max-width:390px;">
  <div class="lh-kpis">
    <div class="lh-kpi lh-t-blue">
      <span class="lh-label">Title odds</span>
      <span class="lh-kpi__row">
        <span class="lh-kpi__value">38%</span>
        <svg class="lh-spark" width="64" height="26" viewBox="0 0 64 26" role="img" aria-label="Title odds over 4 weeks: 22, 27, 32, 38 percent"><polyline points="4,22 22,17 40,12 58,5"/><circle cx="58" cy="5" r="3"/></svg>
      </span>
      <span class="lh-delta lh-delta--up">▲ 6 pts this week</span>
    </div>
    <div class="lh-kpi lh-t-blue">
      <span class="lh-label">This week</span>
      <span class="lh-kpi__value lh-team-text">64%</span>
      <span class="lh-kpi__ctx">to beat Zone Defense</span>
    </div>
    <div class="lh-kpi">
      <span class="lh-label">Points for</span>
      <span class="lh-kpi__value">7,412</span>
      <span class="lh-kpi__ctx">#1 · +276 vs league avg</span>
    </div>
    <div class="lh-kpi">
      <span class="lh-label">FPPG</span>
      <span class="lh-kpi__value">61.8</span>
      <span class="lh-delta lh-delta--down">▼ 2.1 vs last 14 days</span>
    </div>
  </div>
  <div class="lh-tiles3">
    <div class="lh-kpi lh-kpi--nested"><span class="lh-label">Spread</span><span class="lh-kpi__value">GC −64</span></div>
    <div class="lh-kpi lh-kpi--nested"><span class="lh-label">Total</span><span class="lh-kpi__value">3,160</span></div>
    <div class="lh-kpi lh-kpi--nested"><span class="lh-label">Moneyline</span><span class="lh-kpi__value">−178</span></div>
  </div>
</div>
</body></html>
