<!-- @dsCard group="Matchups" height=330 subtitle="Home's matchup card: score, projection, win %, lines" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MatchupCard</title></head>
<body>
<div class="lh-stack" style="max-width:390px;">
  <a href="#" class="lh-card" style="text-decoration:none; color:var(--ink); gap:12px;">
    <span class="lh-mrow lh-t-blue">
      <span class="lh-mono">GC</span>
      <span style="min-width:0;"><span class="lh-mrow__name">Glass Cannons</span><span class="lh-sub">Marcus · 4-1</span></span>
      <span class="lh-num" style="display:flex; flex-direction:column; align-items:flex-end;"><span class="lh-dsp" style="font-size:18px; font-weight:600;">1,182</span><span class="lh-sub">proj 1,612</span></span>
      <span class="lh-mrow__win lh-team-text">64%</span>
    </span>
    <span class="lh-mrow lh-t-teal">
      <span class="lh-mono">ZD</span>
      <span style="min-width:0;"><span class="lh-mrow__name">Zone Defense</span><span class="lh-sub">Tyler · 3-2</span></span>
      <span class="lh-num" style="display:flex; flex-direction:column; align-items:flex-end;"><span class="lh-dsp" style="font-size:18px; font-weight:600;">1,104</span><span class="lh-sub">proj 1,548</span></span>
      <span class="lh-mrow__win">36%</span>
    </span>
    <span class="lh-winbar" role="img" aria-label="Win chance: Glass Cannons 64%, Zone Defense 36%"><span class="lh-t-blue" style="width:64%"></span><span class="lh-t-teal"></span></span>
    <span class="lh-tiles3">
      <span class="lh-kpi lh-kpi--nested"><span class="lh-label">Spread</span><span class="lh-kpi__value">GC −64</span></span>
      <span class="lh-kpi lh-kpi--nested"><span class="lh-label">Total</span><span class="lh-kpi__value">3,160</span></span>
      <span class="lh-kpi lh-kpi--nested"><span class="lh-label">Moneyline</span><span class="lh-kpi__value">−178/+178</span></span>
    </span>
    <span class="lh-divider" style="display:flex; align-items:center; justify-content:space-between; padding-top:10px;">
      <span style="font-size:12px; color:var(--ink-2);">Cannons have 3 more games left</span>
      <span style="font-size:12px; font-weight:700; color:var(--accent);">Details ›</span>
    </span>
  </a>
</div>
</body></html>
