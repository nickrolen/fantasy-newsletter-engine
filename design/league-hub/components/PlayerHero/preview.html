<!-- @dsCard group="Teams & players" height=420 subtitle="The player card's white hero: square headshot, OVR ring, POT, team chip, archetype" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PlayerHero</title></head>
<body>
<div style="max-width:390px;">
  <section class="lh-hero">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <a href="#" class="lh-back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back</a>
      <button class="lh-btn">Compare</button>
    </div>
    <div class="lh-hero__top">
      <div class="lh-headshot" role="img" aria-label="Headshot placeholder">
        <svg width="118" height="128" viewBox="0 0 104 112" aria-hidden="true"><circle cx="52" cy="40" r="26" fill="var(--axis)"/><path d="M4 112c4-30 24-44 48-44s44 14 48 44z" fill="var(--axis)"/></svg>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; gap:12px; align-items:center;">
          <div class="lh-ring lh-t-blue">
            <svg width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Overall rating 94 of 99">
              <circle class="lh-ring__track" cx="40" cy="40" r="34" fill="none" stroke-width="7"/>
              <circle class="lh-ring__arc" cx="40" cy="40" r="34" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="200.8 213.6" transform="rotate(-90 40 40)"/>
            </svg>
            <div class="lh-ring__inner"><span class="lh-ring__value">94</span><span class="lh-ring__label">OVR</span></div>
          </div>
          <div style="display:flex; flex-direction:column;">
            <span class="lh-pot__label">POT</span>
            <span class="lh-pot__value">97</span>
            <span class="lh-delta lh-delta--up">▲ 1 this week</span>
          </div>
        </div>
        <a href="#" class="lh-chip lh-t-blue" style="align-self:flex-start;"><span class="lh-swatch"></span>Glass Cannons</a>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:3px;">
      <h1 class="lh-hero__name">Victor Wembanyama</h1>
      <span class="lh-hero__bio">C, PF · San Antonio · Age 22 · <span class="lh-status lh-status--ok">Healthy</span></span>
    </div>
    <div class="lh-hero__arch">
      <span style="font-size:15px; font-weight:800;">Two-Way Unicorn</span>
      <span style="font-size:12px; color:var(--ink-2);">Blocks · Rebounding · Floor-spacing big</span>
    </div>
  </section>
</div>
</body></html>
