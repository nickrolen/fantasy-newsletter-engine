<!-- @dsCard group="Teams & players" height=170 subtitle="Out, Q, IL, healthy; in a who's-missing list" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StatusChip</title></head>
<body>
<div class="lh-stack" style="max-width:390px;">
  <div style="display:flex; gap:8px; align-items:center;">
    <span class="lh-status lh-status--out">Out</span>
    <span class="lh-status lh-status--q">Q</span>
    <span class="lh-status lh-status--il">IL</span>
    <span class="lh-status lh-status--il">IL · back Dec 1</span>
    <span class="lh-status lh-status--ok">Healthy</span>
  </div>
  <section class="lh-card" style="gap:0;">
    <a href="#" class="lh-t-teal" style="display:grid; grid-template-columns:10px minmax(0,1fr) auto; column-gap:10px; align-items:center; min-height:48px; text-decoration:none; color:var(--ink);">
      <span class="lh-swatch"></span>
      <span style="display:flex; flex-direction:column;"><span style="font-size:14px; font-weight:700;">Brook Lopez</span><span class="lh-sub">Zone Defense · back · NBA report: out Wed</span></span>
      <span class="lh-status lh-status--out">Out</span>
    </a>
    <a href="#" class="lh-t-blue lh-divider" style="display:grid; grid-template-columns:10px minmax(0,1fr) auto; column-gap:10px; align-items:center; min-height:48px; text-decoration:none; color:var(--ink);">
      <span class="lh-swatch"></span>
      <span style="display:flex; flex-direction:column;"><span style="font-size:14px; font-weight:700;">Franz Wagner</span><span class="lh-sub">Glass Cannons · game-time decision Thu</span></span>
      <span class="lh-status lh-status--q">Q</span>
    </a>
  </section>
</div>
</body></html>
