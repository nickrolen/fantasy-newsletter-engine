<!-- @dsCard group="Teams & players" height=200 subtitle="Monogram (picture fallback), swatch, team chip, free agent" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TeamMark</title></head>
<body>
<div class="lh-stack" style="max-width:390px; background:var(--surface);">
  <div style="display:flex; align-items:center; gap:12px;">
    <span class="lh-mono lh-t-blue" style="--s:72px">GC</span>
    <span class="lh-mono lh-t-orange" style="--s:36px">PR</span>
    <span class="lh-mono lh-t-teal">ZD</span>
    <span class="lh-mono lh-t-plum" style="--s:28px">FB</span>
    <span class="lh-swatch lh-t-blue"></span><span class="lh-swatch lh-t-orange"></span><span class="lh-swatch lh-t-teal"></span><span class="lh-swatch lh-t-plum"></span>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:8px;">
    <a href="#" class="lh-chip lh-t-blue"><span class="lh-swatch"></span>Glass Cannons</a>
    <a href="#" class="lh-chip lh-t-orange"><span class="lh-swatch"></span>Pick &amp; Roll Call</a>
    <a href="#" class="lh-chip lh-t-teal"><span class="lh-swatch"></span>Zone Defense</a>
    <a href="#" class="lh-chip lh-t-plum"><span class="lh-swatch"></span>Fast Break Bros</a>
    <span class="lh-chip lh-chip--fa">Free agent</span>
  </div>
</div>
</body></html>
