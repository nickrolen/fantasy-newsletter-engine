[pytest]
# Only the real suite. A bare "python -m pytest" used to collect the copies of
# tests/ that builders leave in _to_delete/ (old code beside them): 11-16 that
# gave 146 failed + 455 errors, all from those copies and the module-name
# clashes they cause. CI already runs "pytest tests/".
testpaths = tests
norecursedirs = _to_delete .git .state design output data config archive node_modules __pycache__
# Two tiers (task 50, 11-16). "slow" is a test over about 1 s on Nick's laptop
# or 0.5 s in a builder's VM (or one sharing a slow module fixture with such a
# test). Builders run the fast tier, Nick the whole suite before a push:
#   python -m pytest -m "not slow" -n 3 -q -p no:cacheprovider
#   python -m pytest -q -p no:cacheprovider -n 4 -rfE
# tests/conftest.py fails any unmarked test that takes over 3 s in the fast tier.
markers =
    slow: over ~1 s; runs in the full suite, not the fast tier
